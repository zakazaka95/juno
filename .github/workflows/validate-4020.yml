name: Validate Juno 4020 review follow-up

on:
  push:
    branches: [validation/juno-4020-review-2026-10-27]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonrpc:
    if: github.repository == 'zakazaka95/juno'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Install native dependencies from repository CI
        run: sudo apt-get update -qq && sudo apt-get install -y libjemalloc-dev libjemalloc2 libbz2-dev pkg-config
      - name: Confirm focused native dependency closure
        run: go list -deps -test -f '{{if .CgoFiles}}{{.ImportPath}} {{.CgoFiles}}{{end}}' ./jsonrpc
      - name: Full JSON-RPC package tests
        shell: bash
        run: |
          go test -short -json ./jsonrpc -count=1 -timeout=5m | tee "$RUNNER_TEMP/juno-jsonrpc.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = [json.loads(line) for line in (Path(os.environ["RUNNER_TEMP"]) / "juno-jsonrpc.jsonl").read_text().splitlines()]
          passed = [row["Test"] for row in rows if row.get("Action") == "pass" and row.get("Test")]
          failed = [row["Test"] for row in rows if row.get("Action") == "fail" and row.get("Test")]
          skipped = [row["Test"] for row in rows if row.get("Action") == "skip" and row.get("Test")]
          print(f"JSON-RPC test events: {len(passed)} passed, {len(failed)} failed, {len(skipped)} skipped")
          assert passed and not failed
          PY
      - name: Vet JSON-RPC package
        run: go vet ./jsonrpc
      - name: Original-production and literal-output negative controls
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("jsonrpc/pretty_error.go")
          original = path.read_text()
          upstream = subprocess.check_output(
              ["git", "show", "301cbb99d4044a3e323ace1792a7605a76a8516e:jsonrpc/pretty_error.go"], text=True,
          )
          controls = [
              ("current upstream production", upstream, "^TestHandleParseError", 4),
              ("absolute column", original.replace("absoluteCol += c.linePrefixRunes", "absoluteCol += 0"), "^TestHandleParseErrorChunked$", 3),
              ("caret column", original.replace(
                  "line, relativeCol, absoluteCol := lineAndColumn(c, markerPos)",
                  "line, _, absoluteCol := lineAndColumn(c, markerPos)",
              ).replace(
                  "return drawMarker(c.window, windowStart, markerPos, relativeCol, msg)",
                  "return drawMarker(c.window, windowStart, markerPos, absoluteCol, msg)",
              ), "^TestHandleParseErrorChunked$", 3),
          ]
          try:
              for name, mutated, pattern, count in controls:
                  assert mutated != original, name
                  path.write_text(mutated)
                  result = subprocess.run(
                      ["go", "test", "-short", "-json", "./jsonrpc", "-run", pattern, "-count=1", "-timeout=90s"],
                      capture_output=True, text=True, timeout=120,
                  )
                  events = [json.loads(line) for line in result.stdout.splitlines() if line.startswith("{")]
                  failures = [
                      event["Test"] for event in events
                      if event.get("Action") == "fail" and "/" in event.get("Test", "")
                  ]
                  print(f"{name}: returncode={result.returncode}, assertion failures={failures}")
                  assert result.returncode != 0 and len(failures) == count, result.stdout + result.stderr
                  assert "[build failed]" not in result.stdout + result.stderr
                  path.write_text(original)
          finally:
              path.write_text(original)
          PY
          go test -short ./jsonrpc -run '^TestHandleParseError' -count=1 -timeout=90s
          git diff --exit-code
      - name: Fresh five-run benchmarks against current main
        shell: bash
        env:
          GOMAXPROCS: "1"
        run: |
          go version
          go env GOOS GOARCH
          lscpu | grep -E 'Model name|Architecture|CPU\(s\)'
          git worktree add --detach "$RUNNER_TEMP/juno-main" 301cbb99d4044a3e323ace1792a7605a76a8516e
          (
            cd "$RUNNER_TEMP/juno-main"
            go test -short ./jsonrpc -run '^$' -bench '^(BenchmarkHandle|BenchmarkHandleLargeRequest)$' -benchmem -benchtime=2s -count=5 -cpu=1
          ) | tee "$RUNNER_TEMP/juno-main-bench.txt"
          go test -short ./jsonrpc -run '^$' -bench '^(BenchmarkHandle|BenchmarkHandleLargeRequest)$' -benchmem -benchtime=2s -count=5 -cpu=1 | tee "$RUNNER_TEMP/juno-feature-bench.txt"
          python3 - <<'PY'
          import os
          import re
          import statistics
          from collections import defaultdict
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          def read(path):
              groups = defaultdict(list)
              for line in path.read_text().splitlines():
                  parts = line.split()
                  if not parts or not parts[0].startswith("Benchmark") or "ns/op" not in parts:
                      continue
                  name = re.sub(r"-\d+$", "", parts[0])
                  groups[name].append((
                      float(parts[parts.index("ns/op") - 1]),
                      int(parts[parts.index("B/op") - 1]),
                      int(parts[parts.index("allocs/op") - 1]),
                  ))
              return groups
          baseline = read(root / "juno-main-bench.txt")
          feature = read(root / "juno-feature-bench.txt")
          assert set(baseline) == set(feature) and len(baseline) == 3
          lines = [
              "Baseline: 301cbb99d4044a3e323ace1792a7605a76a8516e; same runner, GOMAXPROCS=1, 2s, count=5, cpu=1.",
              "| Benchmark | Main ns/op | Feature ns/op | Delta | Main B/op | Feature B/op | Main allocs/op | Feature allocs/op |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for name in sorted(baseline):
              assert len(baseline[name]) == len(feature[name]) == 5, name
              before = [statistics.median(values) for values in zip(*baseline[name])]
              after = [statistics.median(values) for values in zip(*feature[name])]
              delta = 100 * (after[0] / before[0] - 1)
              lines.append(f"| {name} | {before[0]:.3f} | {after[0]:.3f} | {delta:+.2f}% | {before[1]} | {after[1]} | {before[2]} | {after[2]} |")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PY
      - name: Check Go formatting
        shell: bash
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofmt -l jsonrpc/pretty_error.go jsonrpc/pretty_error_test.go)"
          test -z "$(gofumpt -l jsonrpc/pretty_error.go jsonrpc/pretty_error_test.go)"
      - name: Full repository lint configuration on JSON-RPC
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
          args: --verbose ./jsonrpc/...
      - name: Strict changed-line repository lint configuration
        if: always()
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
          args: --config=./.golangci_diff.yaml --new-from-rev=301cbb99d4044a3e323ace1792a7605a76a8516e ./jsonrpc/...
      - name: Confirm source and dependency files restored
        if: always()
        run: git diff --exit-code
